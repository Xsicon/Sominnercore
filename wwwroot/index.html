<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KobNeti - Operations</title>
    <base href="/" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="css/ops-pages.css" />
    <link rel="stylesheet" href="css/support-hub-pages.css" />
    <link rel="stylesheet" href="css/support-tickets.css" />
    <link rel="stylesheet" href="css/support-live-chat.css" />
    <link rel="stylesheet" href="css/support-kb.css" />
    <link rel="stylesheet" href="KobNeti.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" rel="stylesheet" />
    <script>
        // Apply theme immediately to prevent flash of wrong theme
        (function() {
            var KEY = 'sominnercore-ui-theme';
            var saved = localStorage.getItem(KEY) || 'dark';
            var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
        })();
    </script>
</head>

<body>
    <div id="app">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: #666;">
            <svg style="width: 48px; height: 48px; margin-bottom: 16px; animation: spin 1s linear infinite;" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" stroke-dasharray="32" stroke-dashoffset="8"></circle>
            </svg>
            <p>Loading...</p>
        </div>
        <style>
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="js/chat-scroll.js"></script>
    <script>
        // Hide Blazor error UI for hot reload connection failures
        window.addEventListener('error', function(event) {
            if (event.message && (
                event.message.includes('blazor') ||
                event.message.includes('ERR_ABORTED') ||
                event.message.includes('WebSocket')
            )) {
                event.preventDefault();
                return false;
            }
        });
    </script>
    <script>
        (function() {
            var KEY = 'sominnercore-ui-theme';
            var currentMode = localStorage.getItem(KEY) || 'dark';

            function resolve(mode) {
                if (mode === 'system') return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                return mode;
            }

            function apply(mode) {
                currentMode = mode;
                var resolved = resolve(mode);
                localStorage.setItem(KEY, mode);
                document.documentElement.classList.toggle('dark', resolved === 'dark');
                updateIcon(resolved);
                updateActive();
            }

            function updateIcon(resolved) {
                var moon = document.getElementById('icon-moon');
                var sun = document.getElementById('icon-sun');
                if (!moon || !sun) return;
                moon.style.display = resolved === 'light' ? 'none' : '';
                sun.style.display = resolved === 'light' ? '' : 'none';
            }

            function updateActive() {
                document.querySelectorAll('#theme-dropdown .theme-option').forEach(function(o) {
                    o.classList.toggle('active', o.getAttribute('data-theme') === currentMode);
                });
            }

            function toggleDD() {
                var d = document.getElementById('theme-dropdown');
                if (d) d.style.display = d.style.display === 'none' ? '' : 'none';
            }

            function closeDD() {
                var d = document.getElementById('theme-dropdown');
                if (d) d.style.display = 'none';
            }

            function init() {
                updateIcon(resolve(currentMode));
                updateActive();

                var btn = document.getElementById('theme-toggle-btn');
                if (btn && !btn._t) {
                    btn._t = true;
                    btn.addEventListener('click', function(e) { e.stopPropagation(); toggleDD(); });
                }

                document.querySelectorAll('#theme-dropdown .theme-option').forEach(function(o) {
                    if (o._t) return;
                    o._t = true;
                    o.addEventListener('click', function(e) {
                        e.stopPropagation();
                        apply(o.getAttribute('data-theme'));
                        closeDD();
                    });
                });
            }

            document.addEventListener('click', function(e) {
                var w = document.getElementById('theme-dropdown-wrapper');
                if (w && !w.contains(e.target)) closeDD();
            });

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
                if (currentMode === 'system') apply('system');
            });

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

            new MutationObserver(function() {
                var btn = document.getElementById('theme-toggle-btn');
                if (btn && !btn._t) init();
            }).observe(document.body, { childList: true, subtree: true });
        })();
    </script>
    <script>
        window.sominnercoreStorage = {
            get: function (key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            },
            set: function (key, value) {
                try { localStorage.setItem(key, value); } catch (e) { }
            },
            remove: function (key) {
                try { localStorage.removeItem(key); } catch (e) { }
            }
        };

        window.downloadBase64File = function (base64, fileName, contentType) {
            var a = document.createElement('a');
            a.href = 'data:' + (contentType || 'application/octet-stream') + ';base64,' + base64;
            a.download = fileName || 'download';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
    <script>
        // Scroll-spy: highlight active nav link based on scroll position
        (function() {
            var sections = ['home','products','services','about','portfolio','contact'];
            var offset = 80; // header height + buffer

            function update() {
                var scrollY = window.scrollY;
                var active = sections[0];
                for (var i = 0; i < sections.length; i++) {
                    var el = document.getElementById(sections[i]);
                    if (el && el.offsetTop - offset <= scrollY) {
                        active = sections[i];
                    }
                }
                var links = document.querySelectorAll('#main-nav a');
                links.forEach(function(a) {
                    var href = a.getAttribute('href');
                    a.classList.toggle('active', href === '#' + active);
                });
            }

            window.addEventListener('scroll', update, { passive: true });
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', update);
            } else {
                update();
            }
        })();
    </script>
</body>

</html>
